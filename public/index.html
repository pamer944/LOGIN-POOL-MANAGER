<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Pool Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box label {
            display: block;
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-box .count {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button.danger {
            background: #e74c3c;
            margin-top: 10px;
        }

        button.danger:hover {
            background: #c0392b;
        }

        .accounts-list {
            margin-top: 30px;
            max-height: 400px;
            overflow-y: auto;
        }

        .account-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 5px;
            margin-bottom: 10px;
            background: #fafafa;
        }

        .account-info {
            flex: 1;
        }

        .account-phone {
            font-weight: 600;
            color: #333;
        }

        .account-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 5px;
        }

        .status-waiting {
            background: #fff3cd;
            color: #856404;
        }

        .status-in_use {
            background: #cfe2ff;
            color: #084298;
        }

        .status-locked {
            background: #f8d7da;
            color: #842029;
        }

        .status-bad_password {
            background: #f8d7da;
            color: #842029;
        }

        .delete-btn {
            padding: 6px 12px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Login Pool Manager</h1>

        <div id="message" class="message"></div>

        <div class="stats">
            <div class="stat-box">
                <label>Waiting</label>
                <div class="count" id="waiting">0</div>
            </div>
            <div class="stat-box">
                <label>In Use</label>
                <div class="count" id="inUse">0</div>
            </div>
            <div class="stat-box">
                <label>Locked</label>
                <div class="count" id="locked">0</div>
            </div>
            <div class="stat-box">
                <label>Bad Password</label>
                <div class="count" id="badPassword">0</div>
            </div>
        </div>

        <form id="accountForm">
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" placeholder="Enter phone number" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit">Add Account</button>
        </form>

        <button id="clearBtn" class="danger">Clear All Accounts</button>

        <div class="accounts-list" id="accountsList"></div>
    </div>

    <script>
        const API_BASE = '/api';

        async function loadAccounts() {
            try {
                const response = await fetch(`${API_BASE}/accounts`);
                const data = await response.json();

                document.getElementById('waiting').textContent = data.waiting;
                document.getElementById('inUse').textContent = data.inUse;
                document.getElementById('locked').textContent = data.locked;
                document.getElementById('badPassword').textContent = data.badPassword;

                const listHtml = data.accounts.map(account => `
                    <div class="account-item">
                        <div class="account-info">
                            <div class="account-phone">${account.phone}</div>
                            <span class="account-status status-${account.status}">${account.status.replace('_', ' ').toUpperCase()}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteAccount(${account.id})">Delete</button>
                    </div>
                `).join('');

                document.getElementById('accountsList').innerHTML = listHtml;
            } catch (error) {
                showMessage('Error loading accounts', 'error');
            }
        }

        async function addAccount(e) {
            e.preventDefault();
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_BASE}/accounts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });

                if (response.ok) {
                    showMessage('Account added successfully', 'success');
                    document.getElementById('accountForm').reset();
                    loadAccounts();
                } else {
                    showMessage('Error adding account', 'error');
                }
            } catch (error) {
                showMessage('Error adding account', 'error');
            }
        }

        async function deleteAccount(id) {
            if (!confirm('Are you sure?')) return;

            try {
                await fetch(`${API_BASE}/accounts/${id}`, { method: 'DELETE' });
                loadAccounts();
            } catch (error) {
                showMessage('Error deleting account', 'error');
            }
        }

        async function clearAll() {
            if (!confirm('Delete all accounts? This cannot be undone.')) return;

            try {
                await fetch(`${API_BASE}/accounts/clear/all`, { method: 'POST' });
                showMessage('All accounts cleared', 'success');
                loadAccounts();
            } catch (error) {
                showMessage('Error clearing accounts', 'error');
            }
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            setTimeout(() => msg.className = 'message', 3000);
        }

        document.getElementById('accountForm').addEventListener('submit', addAccount);
        document.getElementById('clearBtn').addEventListener('click', clearAll);

        loadAccounts();
        setInterval(loadAccounts, 5000);
    </script>
</body>
</html>
