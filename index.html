<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Pool Manager</title>
  <style>
    body { background: #1a1a1a; color: #fff; font-family: Arial; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 30px; }
    .add-section { background: #2a2a2a; padding: 20px; border-radius: 10px; margin-bottom: 30px; }
    input { width: 100%; padding: 10px; margin: 10px 0; background: #1a1a1a; border: 1px solid #444; color: #fff; border-radius: 5px; }
    button { width: 100%; padding: 10px; background: #059669; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    button:hover { background: #047857; }
    .accounts { margin-top: 30px; }
    .account { background: #2a2a2a; padding: 15px; margin: 10px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .phone { font-size: 18px; font-weight: bold; font-family: monospace; }
    .password { font-size: 12px; color: #888; font-family: monospace; }
    .delete-btn { background: #dc2626; padding: 8px 15px; width: auto; }
    .delete-btn:hover { background: #b91c1c; }
    .empty { text-align: center; color: #666; padding: 40px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔒 Login Pool Manager</h1>
    
    <div class="add-section">
      <h3>Add New Account</h3>
      <input type="text" id="phone" placeholder="Phone number">
      <input type="password" id="password" placeholder="Password">
      <button onclick="addAccount()">Add Account</button>
    </div>

    <div class="accounts">
      <h3>📱 Main Box</h3>
      <div id="accountsList"></div>
    </div>
  </div>

  <script>
    async function loadAccounts() {
      const response = await fetch('/api/accounts');
      const data = await response.json();
      const list = document.getElementById('accountsList');
      
      if (data.accounts.length === 0) {
        list.innerHTML = '<div class="empty">No accounts yet</div>';
        return;
      }
      
      list.innerHTML = data.accounts.map(acc => `
        <div class="account">
          <div>
            <div class="phone">${acc.phone}</div>
            <div class="password">🔑 ${acc.password}</div>
          </div>
          <button class="delete-btn" onclick="deleteAccount(${acc.id})">Delete</button>
        </div>
      `).join('');
    }

    async function addAccount() {
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;
      
      if (!phone || !password) {
        alert('Please enter phone and password');
        return;
      }

      await fetch('/api/accounts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, password })
      });

      document.getElementById('phone').value = '';
      document.getElementById('password').value = '';
      loadAccounts();
    }

    async function deleteAccount(id) {
      if (!confirm('Delete this account?')) return;
      await fetch(`/api/accounts/${id}`, { method: 'DELETE' });
      loadAccounts();
    }

    loadAccounts();
    setInterval(loadAccounts, 2000);
  </script>
</body>
</html>
